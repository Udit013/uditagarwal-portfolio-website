  <!-- Critical loader styles: inlined so the intro paints on the first frame,
       before the CSS/JS bundles arrive. Tokens are duplicated (not var()'d from
       main.css) for exactly that reason. -->
  <style>
    #loader {
      position: fixed; inset: 0; z-index: 100000; pointer-events: none;
      --l-bg: #161614; --l-fg: #f0ece4; --l-a2: #e8855a; --l-a3: #b8d94a;
      --l-bd: rgba(255,255,255,0.15);
    }
    [data-theme="light"] #loader {
      --l-bg: #e2dfd8; --l-fg: #121010; --l-a2: #c05020; --l-a3: #2f7a46;
      --l-bd: rgba(0,0,0,0.18);
    }
    #loader .loader-panels { position: absolute; inset: 0; display: flex; }
    #loader .loader-panel {
      flex: 1; background: var(--l-bg);
      transform: scaleY(1); transform-origin: top; will-change: transform;
    }
    #loader .loader-center {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #loader .loader-mark {
      font-family: 'Unbounded', sans-serif; font-weight: 900;
      font-size: clamp(1.1rem, 3vw, 1.6rem); letter-spacing: .14em;
      text-transform: uppercase; color: var(--l-fg); text-align: center;
      opacity: 0; transform: translateY(10px);
      animation: loader-in .4s cubic-bezier(0.25,1,0.5,1) forwards;
    }
    #loader .loader-mark span { color: var(--l-a2); }
    #loader .loader-bar {
      margin: 14px auto 0; width: 140px; height: 2px;
      background: var(--l-bd); border-radius: 2px; overflow: hidden;
    }
    /* Creeps to 70% on its own, then JS drives it to 100% once the app is
       actually ready — indeterminate progress that never lies about being done. */
    #loader .loader-bar-fill {
      height: 100%; width: 100%; transform: scaleX(0); transform-origin: left;
      background: linear-gradient(90deg, var(--l-a2), var(--l-a3));
      animation: loader-bar 1.1s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    @keyframes loader-in  { to { opacity: 1; transform: translateY(0); } }
    @keyframes loader-bar { to { transform: scaleX(.7); } }
    @media (prefers-reduced-motion: reduce) {
      #loader { display: none; }
    }
  </style>

  <!-- Painted on the first frame; React's Loader takes this over and removes it. -->
  <div id="loader" aria-hidden="true">
    <div class="loader-panels">
      <div class="loader-panel"></div>
      <div class="loader-panel"></div>
      <div class="loader-panel"></div>
    </div>
    <div class="loader-center">
      <div class="loader-mark">
        UDIT<span>.</span>DEV
        <div class="loader-bar"><div class="loader-bar-fill"></div></div>
      </div>
    </div>
  </div>
  <div id="root"></div>
  <!-- Failsafe: the curtain is now plain HTML rather than React output, so if
       the bundle never executes (network failure, parse error, blocked script)
       nothing else would ever take it down. This runs independently of the
       bundle and clears it; Loader.tsx marks the node as claimed so the normal
       path is untouched. -->
  <script>
    setTimeout(function () {
      var l = document.getElementById('loader')
      if (l && l.dataset.claimed !== '1') l.remove()
    }, 6000)
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
