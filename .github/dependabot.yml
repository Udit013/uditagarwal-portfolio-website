# Version-update PRs are switched off (open-pull-requests-limit: 0): updates
# are applied in batches by hand and verified by the e2e suite instead of
# arriving as a stream of individual PRs.
#
# Advisories are still caught: CI's weekly scheduled run fails on any
# high/critical `npm audit` finding, and Dependabot *security* alerts are
# controlled separately in the repo's Settings → Code security.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
